name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server — build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('server/Directory.Packages.props', 'server/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Cleared.slnx

      - name: Build
        run: dotnet build Cleared.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Cleared.slnx --no-build --configuration Release --logger "trx;LogFileName=results.trx" --results-directory ../artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-results
          path: artifacts/test-results
          if-no-files-found: ignore

  client:
    name: client — lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Verify lockfile uses only the public registry
        run: npm run check:registry

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test with coverage
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-coverage
          path: client/coverage
          if-no-files-found: ignore

  vulnerable-packages:
    name: dependency vulnerability scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: client/.nvmrc

      - name: Restore server packages
        working-directory: server
        run: dotnet restore Cleared.slnx

      - name: Fail on vulnerable NuGet packages
        working-directory: server
        run: |
          dotnet list Cleared.slnx package --vulnerable --include-transitive > vuln.txt 2>&1 || true
          cat vuln.txt
          if grep -qiE 'has the following vulnerable packages' vuln.txt; then
            echo "::error::Vulnerable NuGet packages found — see output above (NFR S-09)"
            exit 1
          fi
          echo "No vulnerable NuGet packages reported."

      - name: Fail on high-severity npm advisories
        working-directory: client
        run: npm audit --audit-level=high
