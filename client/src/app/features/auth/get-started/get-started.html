<div class="metallic-chrome flex min-h-screen items-center justify-center px-4 py-10">
  <div class="w-full max-w-md rounded-xl bg-white p-8 shadow-xl shadow-black/20">
    <div class="mb-6 flex items-center gap-2">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        class="size-7 text-gold-600"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
        />
      </svg>
      <span class="text-xl font-medium tracking-tight text-steel-900">Cleared</span>
    </div>

    <h1 class="text-lg font-medium text-steel-900">Create your account</h1>
    <p class="mt-1 text-sm text-steel-500">Set up your company, then start invoicing in minutes.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="mt-6 space-y-4">
      <div>
        <label for="companyName" class="block text-sm font-medium text-steel-700"
          >Company name</label
        >
        <input
          id="companyName"
          type="text"
          formControlName="companyName"
          class="mt-1 block w-full rounded-md border border-steel-200 px-3 py-2 text-sm text-steel-900 shadow-sm focus:border-gold-500 focus:outline-none focus:ring-1 focus:ring-gold-500"
        />
      </div>

      <div>
        <label for="vatStatus" class="block text-sm font-medium text-steel-700">VAT status</label>
        <select
          id="vatStatus"
          formControlName="vatStatus"
          class="mt-1 block w-full rounded-md border border-steel-200 px-3 py-2 text-sm text-steel-900 shadow-sm focus:border-gold-500 focus:outline-none focus:ring-1 focus:ring-gold-500"
        >
          <option value="NotRegistered">Not VAT registered</option>
          <option value="Registered">VAT registered</option>
        </select>
      </div>

      @if (isVatRegistered) {
        <div>
          <label for="vatNumber" class="block text-sm font-medium text-steel-700">VAT number</label>
          <input
            id="vatNumber"
            type="text"
            formControlName="vatNumber"
            class="mt-1 block w-full rounded-md border border-steel-200 px-3 py-2 text-sm text-steel-900 shadow-sm focus:border-gold-500 focus:outline-none focus:ring-1 focus:ring-gold-500"
          />
        </div>
      }

      <hr class="border-steel-100" />

      <div>
        <label for="email" class="block text-sm font-medium text-steel-700">Your email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          class="mt-1 block w-full rounded-md border border-steel-200 px-3 py-2 text-sm text-steel-900 shadow-sm focus:border-gold-500 focus:outline-none focus:ring-1 focus:ring-gold-500"
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-steel-700">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="new-password"
          class="mt-1 block w-full rounded-md border border-steel-200 px-3 py-2 text-sm text-steel-900 shadow-sm focus:border-gold-500 focus:outline-none focus:ring-1 focus:ring-gold-500"
        />
        <p class="mt-1 text-xs text-steel-400">At least 10 characters.</p>
      </div>

      @if (errorMessage()) {
        <p class="rounded-md bg-red-50 px-3 py-2 text-sm text-status-overdue">
          {{ errorMessage() }}
        </p>
      }

      <button
        type="submit"
        [disabled]="submitting()"
        class="w-full rounded-md bg-gold-600 px-4 py-2 text-sm font-medium text-white shadow-sm transition-colors hover:bg-gold-700 disabled:opacity-60"
      >
        {{ submitting() ? 'Creating your account…' : 'Create account' }}
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-steel-500">
      Already have an account?
      <a routerLink="/login" class="font-medium text-gold-600 hover:text-gold-700">Sign in</a>
    </p>
  </div>
</div>
