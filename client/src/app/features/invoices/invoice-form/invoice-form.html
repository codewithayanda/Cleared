<div class="mb-6">
  <h1 class="text-2xl font-medium text-steel-900">New invoice</h1>
  <p class="mt-1 text-sm text-steel-500">Add line items — you can issue it once it's ready.</p>
</div>

<form [formGroup]="form" (ngSubmit)="submit()" class="max-w-2xl space-y-6">
  <div class="rounded-lg border border-steel-200 bg-white p-6 shadow-sm">
    <label for="customerId" class="block text-sm font-medium text-steel-700">Customer</label>
    <select
      id="customerId"
      formControlName="customerId"
      class="mt-1 block w-full rounded-md border border-steel-200 px-3 py-2 text-sm text-steel-900 shadow-sm focus:border-gold-500 focus:outline-none focus:ring-1 focus:ring-gold-500"
    >
      <option value="" disabled>Select a customer…</option>
      @for (customer of customers(); track customer.id) {
        <option [value]="customer.id">{{ customer.name }}</option>
      }
    </select>
    @if (customers().length === 0) {
      <p class="mt-2 text-xs text-steel-500">
        No customers yet —
        <a routerLink="/customers/new" class="font-medium text-gold-600 hover:text-gold-700"
          >add one first</a
        >.
      </p>
    }
  </div>

  <div class="rounded-lg border border-steel-200 bg-white p-6 shadow-sm">
    <h2 class="mb-4 text-sm font-medium text-steel-700">Line items</h2>

    <div formArrayName="lines" class="space-y-3">
      @for (line of lines.controls; track line; let i = $index) {
        <div [formGroupName]="i" class="grid grid-cols-12 items-start gap-2">
          <div class="col-span-4">
            <input
              type="text"
              formControlName="description"
              placeholder="Description"
              class="block w-full rounded-md border border-steel-200 px-3 py-2 text-sm text-steel-900 shadow-sm focus:border-gold-500 focus:outline-none focus:ring-1 focus:ring-gold-500"
            />
          </div>
          <div class="col-span-2">
            <input
              type="number"
              step="0.01"
              formControlName="quantity"
              placeholder="Qty"
              class="block w-full rounded-md border border-steel-200 px-3 py-2 text-sm text-steel-900 shadow-sm focus:border-gold-500 focus:outline-none focus:ring-1 focus:ring-gold-500"
            />
          </div>
          <div class="col-span-2">
            <input
              type="number"
              step="0.01"
              formControlName="unitPrice"
              placeholder="Price"
              class="block w-full rounded-md border border-steel-200 px-3 py-2 text-sm text-steel-900 shadow-sm focus:border-gold-500 focus:outline-none focus:ring-1 focus:ring-gold-500"
            />
          </div>
          <div class="col-span-2">
            <select
              formControlName="vatTreatment"
              class="block w-full rounded-md border border-steel-200 px-2 py-2 text-sm text-steel-900 shadow-sm focus:border-gold-500 focus:outline-none focus:ring-1 focus:ring-gold-500"
            >
              @for (treatment of vatTreatments; track treatment.value) {
                <option [value]="treatment.value">{{ treatment.label }}</option>
              }
            </select>
          </div>
          <div class="col-span-1 flex h-9 items-center justify-end text-sm text-steel-600">
            {{ lineTotal(i) | number: '1.2-2' }}
          </div>
          <div class="col-span-1 flex h-9 items-center justify-end">
            <button
              type="button"
              (click)="removeLine(i)"
              [disabled]="lines.length === 1"
              class="text-steel-400 hover:text-status-overdue disabled:opacity-30"
              aria-label="Remove line"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                class="size-5"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M14.74 9-.346 9M9.26 9l.346 9M18.75 5.79c0 .414-.336.75-.75.75H6a.75.75 0 0 1-.75-.75m13.5 0a.75.75 0 0 0-.75-.75H6a.75.75 0 0 0-.75.75m13.5 0v14.25a2.25 2.25 0 0 1-2.25 2.25h-9a2.25 2.25 0 0 1-2.25-2.25V5.79m0 0h13.5"
                />
              </svg>
            </button>
          </div>
        </div>
      }
    </div>

    <button
      type="button"
      (click)="addLine()"
      class="mt-3 text-sm font-medium text-gold-600 hover:text-gold-700"
    >
      + Add line
    </button>

    <div class="mt-4 flex justify-end border-t border-steel-100 pt-4">
      <div class="text-sm text-steel-600">
        Subtotal:
        <span class="ml-2 text-base font-medium text-steel-900"
          >R {{ subtotal | number: '1.2-2' }}</span
        >
      </div>
    </div>
  </div>

  <div class="flex items-center gap-3">
    <button
      type="submit"
      [disabled]="submitting()"
      class="rounded-md bg-gold-600 px-4 py-2 text-sm font-medium text-white shadow-sm transition-colors hover:bg-gold-700 disabled:opacity-60"
    >
      {{ submitting() ? 'Saving…' : 'Save draft' }}
    </button>
    <a routerLink="/invoices" class="text-sm font-medium text-steel-500 hover:text-steel-700"
      >Cancel</a
    >
  </div>
</form>
