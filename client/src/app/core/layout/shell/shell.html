<div class="flex h-screen overflow-hidden bg-steel-50">
  <aside class="metallic-chrome flex w-64 flex-shrink-0 flex-col text-steel-100">
    <div class="flex items-center gap-2 border-b border-steel-700/60 px-6 py-5">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        class="size-6 text-gold-400"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
        />
      </svg>
      <span class="text-lg font-medium tracking-tight text-white">Cleared</span>
    </div>

    <nav class="flex-1 space-y-1 px-3 py-4">
      <a
        routerLink="/dashboard"
        routerLinkActive="bg-steel-800 text-white"
        class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-steel-300 transition-colors hover:bg-steel-800 hover:text-white"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          class="size-5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M2.25 12 11.204 3.045a1.125 1.125 0 0 1 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75"
          />
        </svg>
        Dashboard
      </a>

      <a
        routerLink="/customers"
        routerLinkActive="bg-steel-800 text-white"
        class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-steel-300 transition-colors hover:bg-steel-800 hover:text-white"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          class="size-5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z"
          />
        </svg>
        Customers
      </a>

      <a
        routerLink="/invoices"
        routerLinkActive="bg-steel-800 text-white"
        class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-steel-300 transition-colors hover:bg-steel-800 hover:text-white"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          class="size-5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M10.5 6h9.75M10.5 6a1.5 1.5 0 1 1-3 0m3 0a1.5 1.5 0 1 0-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-9.75 0h9.75"
          />
        </svg>
        Invoices
      </a>
    </nav>

    <div class="border-t border-steel-700/60 px-3 py-4">
      <button
        type="button"
        (click)="logout()"
        class="flex w-full items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-steel-300 transition-colors hover:bg-steel-800 hover:text-white"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          class="size-5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75"
          />
        </svg>
        Sign out
      </button>
    </div>
  </aside>

  <main class="flex-1 overflow-y-auto">
    <div class="mx-auto max-w-5xl px-8 py-8">
      <router-outlet />
    </div>
  </main>
</div>
